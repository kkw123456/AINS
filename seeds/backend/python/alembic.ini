# Alembic 配置。只对 MySQL 路径有意义；sqlite/内存路径不依赖它（启动时 create_all）。
# 运行：alembic upgrade head   （需先设置 DATABASE_URL）

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url 在 alembic/env.py 里从 DATABASE_URL 读，这里留空。
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
